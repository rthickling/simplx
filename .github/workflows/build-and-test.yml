name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compilers:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.toolchain.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
        toolchain:
          - name: GCC 16.2
            image: gcc:16.2.0-trixie
            cc: gcc
            cxx: g++
          - name: Clang 22
            image: silkeh/clang:22-trixie
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends cmake ninja-build just

      - name: Initialise Google Test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          just deps

      - name: Show toolchain
        run: |
          "$CXX" --version
          cmake --version

      - name: Build, test and compile tutorials
        run: just test "${{ matrix.build_type }}"
